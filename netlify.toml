[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The function claims /api/analyze itself via its exported `config.path`. This
# redirect is the belt to that braces: if the v2 path config is ever ignored,
# /api/* still reaches the function instead of falling through to the SPA rule
# below and returning index.html with a 200 — which looks like success and is
# the single most confusing way for this endpoint to break.
#
# Order matters: Netlify takes the first matching rule, so this must stay above
# the catch-all.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Single-page app: every other route serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The clip corpus is immutable and content-addressed by name; the build never
# rewrites it, so it can be cached hard. 8.8MB should be fetched once.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
