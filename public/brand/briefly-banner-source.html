<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Briefly README banner</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 540px; margin: 0; overflow: hidden; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .banner {
      position: relative;
      width: 1200px;
      height: 540px;
      overflow: hidden;
      border-radius: 28px;
      background: linear-gradient(135deg, #fdfdf9 0%, #f2f4ec 100%);
      color: #141510;
    }
    .halo {
      position: absolute;
      width: 460px;
      height: 460px;
      right: -160px;
      top: -190px;
      border-radius: 50%;
      background: #dce2d4;
    }
    .copy {
      position: absolute;
      left: 72px;
      top: 58px;
      width: 710px;
    }
    .logo {
      display: block;
      width: 570px;
      height: auto;
    }
    .rule {
      width: 72px;
      height: 6px;
      margin-top: 38px;
      border-radius: 999px;
      background: #b82d0c;
    }
    h1 {
      max-width: 720px;
      margin: 22px 0 14px;
      font-size: 57px;
      line-height: 1.02;
      letter-spacing: -2.6px;
      font-weight: 760;
    }
    p {
      max-width: 700px;
      margin: 0;
      color: #596255;
      font-size: 22px;
      line-height: 1.45;
      font-weight: 500;
    }
    .mark-panel {
      position: absolute;
      right: 62px;
      bottom: 50px;
      width: 286px;
      height: 344px;
      overflow: hidden;
      border-radius: 36px;
      background: rgba(255, 255, 255, .88);
      box-shadow: 0 28px 70px rgba(60, 68, 52, .13);
    }
    .mark-panel img {
      position: absolute;
      width: 785px;
      height: auto;
      left: 28px;
      top: 48px;
    }
    .mark-panel::after {
      content: "SIGNAL → BRIEF";
      position: absolute;
      left: 32px;
      bottom: 24px;
      color: #667061;
      font-size: 13px;
      line-height: 1;
      letter-spacing: 2.4px;
      font-weight: 750;
    }
    .dot-grid {
      position: absolute;
      right: 32px;
      bottom: 22px;
      width: 92px;
      height: 92px;
      opacity: .42;
      background-image: radial-gradient(#aeb8a7 2px, transparent 2px);
      background-size: 15px 15px;
    }
  </style>
</head>
<body>
  <main class="banner" aria-label="Briefly — trend signals made actionable">
    <div class="halo"></div>
    <section class="copy">
      <img class="logo" src="briefly-logo.png" alt="Briefly" />
      <div class="rule"></div>
      <h1>Trend signals, made actionable.</h1>
      <p>A shared workspace where people and AI agents turn research and business context into grounded content briefs.</p>
    </section>
    <aside class="mark-panel" aria-hidden="true">
      <img src="briefly-logo.png" alt="" />
    </aside>
    <div class="dot-grid" aria-hidden="true"></div>
  </main>
</body>
</html>
